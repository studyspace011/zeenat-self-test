<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Zeenat's Sparkle Quiz ✨</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
</head>
<body>
    <div id="home-screen" class="screen active">
        <div class="container">
            <h1>✨ Zeenat's Sparkle Quiz ✨</h1>
            <h2 class="welcome-msg">Welcome, Zeenat! Let's get started 💖</h2>
            <div class="upload-section">
                <input type="file" id="csv-file" accept=".csv" />
                <label for="csv-file" class="upload-btn">📁 CSV फ़ाइल चुनें</label>
            </div>
            
            <div id="status" class="status">
                <span id="question-count">0</span> प्रश्न लोड हो चुके हैं!
            </div>

            <div id="test-setup" class="test-setup hidden">
                <h3>🎀 Test Settings 🎀</h3>
                
                <div class="setting-item">
                    <label>Chapter Name (Optional):</label>
                    <input type="text" id="subject-name" placeholder="जैसे: भौतिकी, रसायन विज्ञान">
                </div>
                
                <div class="setting-item">
                    <label>Chapter No (Optional):</label>
                    <input type="text" id="chapter-number" placeholder="जैसे: 1, 2, 3">
                </div>
                
                <div class="setting-item">
                    <label>प्रश्नों की संख्या:</label>
                    <input type="number" id="num-questions" min="1" value="10">
                </div>
                
                <div class="setting-item">
                    <label>कुल समय (मिनट में):</label>
                    <input type="number" id="total-time-limit" min="1" value="30" placeholder="मिनट">
                </div>
                
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="shuffle-questions" checked>
                        प्रश्न शफ़ल करें
                    </label>
                </div>
                
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="shuffle-options" checked>
                        विकल्प शफ़ल करें
                    </label>
                </div>
                
                <button id="start-test" class="primary-btn">🚀 टेस्ट शुरू करें!</button>
            </div>
            
            <div class="navigation-links">
                <button id="view-history" class="secondary-btn">📚 पिछले प्रयास देखें</button>
            </div>
        </div>
    </div>

    <div id="test-screen" class="screen">
        <div class="container">
            <div class="test-header">
                <div class="timer">⏱️ <span id="time-left">00:00</span></div>
                <div class="progress">
                    प्रश्न <span id="current-question">1</span> / <span id="total-questions">0</span>
                </div>
            </div>
            
            <div id="question-container" class="question-container">
                <h3 id="question-text"></h3>
                <div id="options-container" class="options-container">
                    </div>
            </div>

            <div class="test-controls">
                <button id="prev-btn" class="secondary-btn">⬅️ Previous</button>
                <button id="next-btn" class="primary-btn">Next ➡️</button>
                <button id="submit-test" class="success-btn">🎉Submit</button>
            </div>
        </div>
    </div>

    <div id="results-screen" class="screen">
        <div id="celebration-animation"></div>
        <div class="container">
            <h2>📊 Your Result Zeenat!</h2>
            
            <div class="result-summary">
                <div class="score-card">
                    <h3>Your Score</h3>
                    <div class="score"><span id="score">0</span>/<span id="total-score">0</span></div>
                    <div class="percentage"><span id="percentage">0</span>%</div>
                </div>
                
                <div class="test-info">
                    <div class="info-item">
                        <strong>Subject:</strong> <span id="result-subject">-</span>
                    </div>
                    <div class="info-item">
                        <strong>Chapter:</strong> <span id="result-chapter">-</span>
                    </div>
                    <div class="info-item">
                        <strong>लगा समय:</strong> <span id="time-taken">00:00</span>
                    </div>
                </div>
            </div>

            <div class="detailed-results">
                <h3>📝 Detailed Review</h3>
                <div id="questions-review" class="questions-review">
                    </div>
            </div>

            <div class="result-actions">
                <button id="new-test" class="primary-btn">💖 Give 1 More Test</button>
                <button id="export-results" class="secondary-btn">📥 Download Your Result</button>
            </div>
        </div>
    </div>

    <div id="history-screen" class="screen">
        <div class="container">
            <h2>📚 तुम्हारे पिछले प्रयास</h2>
            <div id="history-list" class="history-list">
                </div>
            <div class="history-actions">
                <button id="back-to-home" class="secondary-btn">🏠 Back To Home </button>
                <button id="clear-history" class="danger-btn">🗑Delete All Test History</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
